# Minimal mosquitto config for the conduit MQTT chat example.
#
# Start the broker (from the repo root):
#
#     mosquitto -v -c transports/mqtt/examples/mosquitto.conf
#
# Then in separate terminals run multiple chat nodes against it:
#
#     ./build/transports/mqtt/examples/conduit_mqtt_chat alice "hi from alice"
#     ./build/transports/mqtt/examples/conduit_mqtt_chat bob   "hi from bob"
#     ./build/transports/mqtt/examples/conduit_mqtt_chat carol
#
# Each process broadcasts every ~2s and prints every message the broker hands
# back, so you'll see all three nodes' traffic interleaved in every terminal.

# Listen on the standard MQTT port, localhost only.
listener 1883 127.0.0.1

# No authentication — local demo only. Do NOT use in production.
allow_anonymous true

# In-memory broker — nothing persists across restarts.
persistence false

# Log to stderr so you can watch broker activity alongside the clients.
log_dest stderr
log_type notice
log_type warning
log_type error
log_type information
